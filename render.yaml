# Blueprint do Render: cria a API (com a central) a partir deste repositório.
# O n8n não está aqui: ele precisa de ~550 MB de memória e o plano do Render tem 512 MB
# (medição no README). Para rodar o n8n, use o docker-compose ou um serviço com 1 GB ou mais
# (deploy/n8n.Dockerfile já está pronto para isso).
# No Render: New > Blueprint > escolha o repositório. Os valores marcados com sync: false
# são pedidos na tela de criação.
services:
  - type: web
    name: sindico-ia-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # Modelo leve como principal: classificar mensagens é simples e ele responde bem mais rápido
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODELOS_RESERVA
        value: gemini-3.7-flash,gemini-3.8-flash
      # Se um modelo demorar ou estiver sobrecarregado, passa logo para o próximo
      - key: AI_TIMEOUT_SEGUNDOS
        value: "15"
      - key: AI_TENTATIVAS_SOBRECARGA
        value: "1"
      - key: AI_LIMITE_DIARIO
        value: "100"
      - key: CORS_ORIGENS_REGEX
        value: ^https://sindico-ia[a-z0-9-]*\.vercel\.app$  # a central publicada na Vercel
      - key: DATABASE_PATH
        value: /tmp/sindico.db # plano gratuito: os dados somem quando o serviço reinicia
      - key: TZ
        value: America/Sao_Paulo
